<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Anikó Biró – UX/UI designer portfolio: case studies on human–AI design, collaborative AI chat, setup guide redesign and a skill-building platform.">
<meta name="theme-color" content="#ffffff">
<title>Anikó Biró Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Layout: 12-column editorial grid, 1024px content column with 128px desktop gutters (Figma "content · 12 col"), single light theme taken from the portfolio's own design tokens. */
:root{
  --bg:#ffffff; --surface:#f4f4f5; --surface-2:#ebebed; --fg:#0d0e11; --muted:#5b616d; --subtle:#868c97;
  --on-dark:#ffffff; --line:#e5e6e9; --line-strong:#cfd2d7;
  --serif:"Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, monospace;
  --content:1024px; --gutter:20px; --section:48px; --card-pad:24px;
  --display:40px; --display-lh:52px; --h1:28px; --h1-lh:44px; --h3:20px; --h3-lh:32px; --h4:16px; --h4-lh:24px; --h5:14px;
  --body:14px; --small:12px; --label:14px;
  color-scheme:light;
}
@media (min-width:720px){:root{--gutter:48px; --section:64px; --card-pad:32px; --display:52px; --display-lh:68px; --h1:34px; --h1-lh:52px; --h3:24px; --h3-lh:38px; --h4:18px; --h4-lh:28px; --h5:16px}}
@media (min-width:1100px){:root{--gutter:128px; --display:64px; --display-lh:84px; --h1:40px; --h1-lh:64px; --h3:28px; --h3-lh:44px; --h4:20px; --h4-lh:32px}}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--body);line-height:24px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
b,strong{font-weight:600;color:var(--fg)}
h1,h2,h3,h4,h5{margin:0;font-family:var(--serif);font-weight:600;color:var(--fg);text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

.wrap{width:min(var(--content), 100% - 2*var(--gutter));margin-inline:auto}
.section{padding-block:var(--section)}
.section.grey{background:var(--surface)}
.section.grey + .section.grey{padding-top:0}
.stack{display:grid;gap:16px}
.stack-lg{display:grid;gap:32px}

/* type */
.display{font-size:var(--h1);line-height:var(--h1-lh)}
.h3{font-size:var(--h3);line-height:var(--h3-lh)}
.h4{font-size:var(--h4);line-height:var(--h4-lh)}
.h5{font-size:var(--h5);line-height:24px}
.eyebrow{font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.prose{color:var(--muted);display:grid;gap:8px;min-width:0}
.prose ul{margin:0;padding-left:1.4em;display:grid;gap:4px}
.muted{color:var(--muted)}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.site-header.scrolled{border-color:var(--line)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:68px;gap:16px}
.brand{font-family:var(--serif);font-weight:600;font-size:20px;text-decoration:none}
.nav{display:flex;gap:8px}
.nav a{font-weight:600;font-size:var(--label);text-decoration:none;padding:10px 16px;border-bottom:2px solid transparent}
.nav a[aria-current="page"]{border-color:var(--fg)}
.nav a:hover{border-color:var(--line-strong)}

/* tags */
.tag{display:inline-flex;align-self:flex-start;justify-self:start;align-items:center;padding:4px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:var(--small)}
.tag.on-grey{background:var(--bg)}

/* grids */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:720px){.g2,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:960px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* text blocks */
.tb-split{display:grid;gap:16px;align-items:start}
@media (min-width:720px){.tb-split{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tb-split .head{display:grid;gap:16px}

/* hero (case study) */
.hero{position:relative;background:var(--fg) center/cover no-repeat;padding:16px}
@media (min-width:720px){.hero{padding:32px;min-height:600px;display:flex}}
.hero-card{background:var(--bg);padding:32px 20px;display:grid;gap:16px;align-content:start}
@media (min-width:720px){.hero-card{width:66.6667%;padding:32px 64px 64px max(32px, calc(var(--gutter) - 32px))}}
.hero-card h1{font-size:var(--display);line-height:var(--display-lh);font-weight:700;max-width:16ch}
.hero-card .lead{color:var(--muted);max-width:600px}
.hero-card .year{font-family:var(--serif);font-weight:600;color:var(--muted)}

/* home band */
.band{background:#1e1e1e url(img/bg-home.webp) center/cover no-repeat}
.band .tb-split p{color:var(--on-dark)}
@media (max-width:719px){.band{background-position:62% center}.band .eyebrow,.band h2{color:var(--on-dark)}}

/* cards */
.card{display:flex;flex-direction:column;min-width:0;background:var(--bg);border:1px solid var(--line-strong);text-decoration:none;color:inherit}
.card.contained{background:var(--surface);border-color:transparent}
.card.filled{background:var(--bg);border-color:transparent}
.card .inner{display:grid;gap:16px;align-content:start;padding:var(--card-pad);flex:1}
.card .action{margin-top:auto;padding-top:48px;font-weight:600;font-size:var(--label);display:inline-flex;gap:6px;align-items:center}
.card .action span{transition:transform .2s}
a.card{transition:border-color .2s, box-shadow .2s}
a.card:hover{border-color:var(--fg)}
a.card:hover .action span{transform:translateX(4px)}
a.card.contained:hover{border-color:var(--line-strong)}
.card .icon{width:24px;height:24px}
.card .media{background:var(--surface);display:flex;align-items:center;justify-content:center;padding:32px 24px;min-height:200px}
.card.filled .media{background:var(--surface-2)}
.card .media img{width:var(--w,100%);max-width:100%}
.card.media-end .media{padding:16px;flex:1;align-items:center}
.card.media-end .inner{flex:none}
@media (min-width:720px){
  .card.media-side{flex-direction:row}
  .card.media-side .media{flex:0 0 48%;min-height:0;padding:32px}
  .card.media-side.right{flex-direction:row-reverse}
  .card.media-side .inner{align-content:center}
}

/* process steps */
.steps{display:grid;gap:32px 16px;grid-template-columns:1fr}
@media (min-width:720px){.steps.s3{grid-template-columns:repeat(3,minmax(0,1fr))}.steps.s4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:960px){.steps.s4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.step{border-top:1px solid var(--fg);padding-top:24px;display:grid;gap:16px;align-content:start;min-width:0}
.step .num{font-weight:600;font-size:var(--small);color:var(--subtle);font-variant-numeric:tabular-nums}

/* industries & resume */
.rows{display:grid}
.row{display:grid;gap:16px;padding-block:24px;border-bottom:1px solid var(--line)}
.row:first-child{padding-top:0}
.row:last-child{border-bottom:0}
.row .title{font-family:var(--serif);font-weight:600;font-size:var(--h4);line-height:var(--h4-lh)}
.row .title .sec{color:var(--muted)}
.resume .row{padding-block:24px}
.resume .row:first-child{padding-top:24px;border-top:1px solid var(--line)}
@media (min-width:720px){.resume .row{grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}}
.row .date{font-family:var(--serif);font-size:var(--h4);line-height:var(--h4-lh);color:var(--muted);font-variant-numeric:tabular-nums}

/* quote */
.quote{border-left:2px solid var(--fg);padding-left:32px;display:grid;gap:16px;max-width:851px;margin-inline:auto}
.quote blockquote{margin:0;font-family:var(--serif);font-size:var(--h3);line-height:var(--h3-lh)}
.quote blockquote b{font-weight:600}
.quote cite{font-style:normal;color:var(--subtle);font-size:var(--small)}

/* flow diagram */
.flow{display:grid;gap:4px;grid-template-columns:1fr}
.flow .start{display:grid;gap:4px}
.flow .start .label{font-family:var(--serif);font-weight:600;font-size:var(--h4)}
.flow .start .desc{color:var(--muted)}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:flex-start}
.flow li{display:flex;flex-direction:column;align-items:flex-start}
.pill{border:1px solid var(--line-strong);border-radius:999px;padding:4px 16px;white-space:nowrap;background:var(--bg)}
.pill.hl{border-color:var(--fg)}
.conn{position:relative;width:1px;height:28px;background:var(--line-strong);margin-left:24px}
.conn.dot::before,.conn.arrow::after{content:"";position:absolute;left:50%;transform:translateX(-50%)}
.conn.dot::before{top:-4px;width:8px;height:8px;border-radius:50%;background:var(--fg)}
.conn.arrow::after{bottom:0;border:5px solid transparent;border-top:8px solid var(--fg);border-bottom:0}
@media (min-width:960px){
  .flow{grid-template-columns:auto 1fr;align-items:start;column-gap:0}
  .flow .start{grid-template-columns:1fr;position:relative;min-width:120px}
  .flow .start .line{height:1px;background:var(--line-strong);position:relative;margin-top:19px}
  .flow .start .line::after{content:"";position:absolute;right:0;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--fg)}
  .flow ol{flex-direction:row;align-items:center;flex-wrap:nowrap;margin-top:30px}
  .flow li{flex-direction:row;align-items:center;flex:0 0 auto}
  .conn{width:auto;min-width:40px;flex:1;height:1px;margin:0}
  .conn.dot::before{top:-4px;left:0;transform:none}
  .conn.arrow::after{bottom:auto;top:-5px;left:auto;right:0;transform:none;border:5px solid transparent;border-left:8px solid var(--fg);border-right:0}
}
@media (max-width:959px){.flow .start .line{display:none}.flow{gap:12px}}

/* figures */
figure{margin:0;display:grid;gap:12px;min-width:0}
figcaption{color:var(--muted);font-size:var(--small)}
.zoom{cursor:zoom-in;padding:0;border:0;background:none;display:block;width:100%;text-align:inherit;font:inherit;color:inherit}
.frame{border:1px solid var(--line-strong);background:var(--bg)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.scroll-x .wide{min-width:880px}
.hint{font-size:var(--small);color:var(--subtle);display:none}
@media (max-width:899px){.hint{display:block}}

/* legend */
.legend{display:grid;gap:16px;align-items:center}
@media (min-width:720px){.legend{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.legend .pic{background:var(--surface);padding:16px}
.legend ol{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.legend li{display:flex;gap:12px;align-items:center;color:var(--muted)}
.badge{flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--on-dark);display:grid;place-items:center;font-weight:600;font-size:12px}

/* image band + device frame */
.imgband{background:#aaa url(img/bg-band.webp) center/cover no-repeat;padding-block:var(--section)}
.imgband.plain{background:var(--surface)}
/* Device frame component: Desktop = 10px bezel, 32px radius; Mobile = 4px bezel, 14px radius */
.device{background:var(--bg);border:4px solid var(--fg);border-radius:14px;overflow:hidden}
@media (min-width:720px){.device{border-width:10px;border-radius:32px}}
.device .screen{position:relative;background:var(--surface)}
.device .screen>img{display:block;width:100%;height:auto}
.proto .screen{aspect-ratio:1928/1283}
.proto .screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

/* prototype carousel */
.proto .screen img{opacity:0;transition:opacity .5s ease}
.proto .screen img.on{opacity:1}
.proto-bar{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;flex-wrap:nowrap}
.ctl{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);cursor:pointer}
.ctl:hover{border-color:var(--fg)}
.ctl svg{width:18px;height:18px}
.dots{display:flex;gap:2px;align-items:center;min-width:0}
.dots button{width:auto;min-width:14px;height:28px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
@media (min-width:720px){.proto-bar{gap:16px}.dots{gap:6px}.dots button{min-width:28px}}
.dots button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-strong);transition:all .3s}
.dots button::before{opacity:.55}
.dots button[aria-current="true"]::before{background:var(--line-strong);opacity:1;width:20px;border-radius:4px}
@media (max-width:719px){.card .media{padding:24px 16px;min-height:0}}
.proto-count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:var(--small);min-width:5ch;text-align:center;background:var(--bg);border-radius:999px;padding:4px 10px}

/* progress screens strip */
.strip{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
@media (max-width:719px){.strip{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}.strip>*{flex:0 0 auto}}
.strip-bar{display:none;margin:0 0 16px}
@media (max-width:719px){.strip-bar{display:flex}}

/* footer */
.site-footer{border-top:1px solid var(--line);padding-block:64px}
.site-footer .wrap{display:grid;gap:40px}
@media (min-width:720px){.site-footer .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:80px}}
.hello{display:grid;gap:16px;align-content:start;max-width:472px}
.btn-dark{justify-self:start;display:inline-flex;gap:6px;align-items:center;background:var(--fg);color:var(--on-dark);text-decoration:none;font-weight:600;font-size:var(--label);padding:10px 20px}
.btn-dark span{transition:transform .2s}
.btn-dark:hover span{transform:translateX(4px)}
.contact{display:grid;gap:12px;align-content:start}
.contact .lines{display:grid;gap:4px;color:var(--muted)}
.contact .lines{gap:8px}
.cline{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cval{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;color:var(--fg)}
.copy{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer}
.copy:hover,.copy:focus-visible{color:var(--fg)}
.copy svg{width:16px;height:16px}
.copy .ic-ok{display:none}
.copy.done{color:var(--fg)}
.copy.done .ic-copy{display:none}
.copy.done .ic-ok{display:block}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(13,14,17,.92);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);}
.lb .bar{display:flex;justify-content:space-between;align-items:center;color:var(--on-dark);gap:12px;padding-bottom:8px}
.lb .bar span{font-size:14px;opacity:.8}
.lb .ctl{background:transparent;color:var(--on-dark);border-color:rgba(255,255,255,.35)}
.lb .view{flex:1;overflow:auto;display:grid;place-items:center;-webkit-overflow-scrolling:touch}
.lb .view img{max-width:none;width:auto;max-height:none;cursor:zoom-out}
.lb .view.fit img{max-width:100%;max-height:100%;cursor:zoom-in}

main{min-height:60vh}
.page-enter{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="site-header" id="top">
  <div class="wrap">
    <a class="brand" href="#home">Anikó Biró</a>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-nav="work">Work</a>
      <a href="#resume" data-nav="resume">Resume</a>
    </nav>
  </div>
</header>
<main id="main"></main>
<footer class="site-footer" id="footer"></footer>

<!-- Disable automatic lightbox opening: intercept clicks on .zoom and hide the lightbox element -->
<script>
(function(){
  function stopZoomClicks(e){
    try{
      const z = e.target.closest && e.target.closest('.zoom');
      if(z){
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }catch(_){/* ignore */}
  }
  // Capture phase listener to block the page's lightbox handler
  document.addEventListener('click', stopZoomClicks, true);
  // Ensure the lightbox element is hidden if present
  function hideLb(){
    const lb = document.getElementById('lb');
    if(lb){ lb.hidden = true; lb.style.display = 'none'; }
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hideLb); else hideLb();
})();
</script>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Image viewer">

  <div class="view fit" id="lb-view"><img id="lb-img" alt=""></div>
</div>
